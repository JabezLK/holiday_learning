/* Layout concept: an MRT map with three lines. The Pinyin Line, then one line for each textbook, 1A and 1B. Each textbook lesson is a station. */
:root{
  --bg:#f1f7f2; --surface:#ffffff; --surface2:#e2efe6; --ink:#12301f; --muted:#4f6a5a; --hair:#c5dacb;
  --line-py:#0a62c4; --line-a:#d42e12; --line-b:#00853f;
  --ok:#00803c; --okbg:#dcf5e5; --no:#b4330f; --nobg:#fde7dd; --hintbg:#fff3cf; --star:#f2a900; --amber:#b87a00; --grid:#e29a8b;
  --display:"Grandstander","Trebuchet MS",sans-serif; --body:"Andika","Segoe UI",Verdana,sans-serif;
  --han:"SchoolKai","HolidayKai","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1c14; --surface:#17301f; --surface2:#21402c; --ink:#eaf6ee; --muted:#a6c2b0; --hair:#2f5240;
  --line-py:#63aaf5; --line-a:#ff6b4f; --line-b:#3cc97c;
  --ok:#53d990; --okbg:#143c29; --no:#ff9a7e; --nobg:#46231a; --hintbg:#40371a; --star:#ffc53d; --amber:#f2b632; --grid:#a0584a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1c14; --surface:#17301f; --surface2:#21402c; --ink:#eaf6ee; --muted:#a6c2b0; --hair:#2f5240;
  --line-py:#63aaf5; --line-a:#ff6b4f; --line-b:#3cc97c;
  --ok:#53d990; --okbg:#143c29; --no:#ff9a7e; --nobg:#46231a; --hintbg:#40371a; --star:#ffc53d; --amber:#f2b632; --grid:#a0584a;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 18px/1.45 var(--body);font-synthesis:none;-webkit-tap-highlight-color:transparent}
#app{max-width:1040px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--line-py);outline-offset:2px}
.han{font-family:var(--han)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 22px;border-radius:14px;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--ink);color:var(--bg)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--surface2);color:var(--ink)}
.btn.wide{width:100%}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--surface2);flex:none;font:800 .95rem var(--han)}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.off{opacity:.45}
.iconbtn.live{background:var(--star);color:#231a00;animation:speak 1s ease-in-out infinite}
@keyframes speak{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--star) 35%,transparent)}}
.textlink{text-decoration:underline;color:var(--muted);font-size:.95rem;padding:10px 4px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.topbar .grow{flex:1;min-width:0}
.eyebrow{font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
/* Home */
.mast{display:grid;gap:16px;margin-bottom:22px}
.mast h1{font-size:clamp(2.1rem,7vw,3.2rem)}
.ride-card{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:grid;gap:12px}
.ride-card h2{font-size:1.5rem}
.ride-card .btn{background:var(--star);color:#231a00}
.stamps{display:flex;flex-wrap:wrap;gap:4px}
.stamp{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;opacity:.35}
.stamp.on{background:var(--star);border-color:var(--star);opacity:1}
@media(min-width:760px){.mast{grid-template-columns:1.1fr 1fr;align-items:center}}
.linehead{display:flex;align-items:center;gap:10px;margin:20px 0 6px}
.linehead h2{font-size:1.25rem}
.linehead i{width:30px;height:10px;border-radius:5px;background:var(--c)}
.line{list-style:none;margin:0;padding:0;display:grid}
@media(min-width:760px){.line{grid-template-columns:1fr 1fr;column-gap:28px}}
.stn{position:relative;padding-left:58px}
.stn::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:10px;background:var(--c)}
.stn:first-child::before{top:30px}
.stn:last-child::before{bottom:calc(100% - 30px)}
.stn::after{content:"";position:absolute;left:10px;top:17px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:6px solid var(--c)}
@media(min-width:760px){.stn:nth-child(2)::before{top:30px}.stn:nth-last-child(2):nth-child(odd)::before{bottom:calc(100% - 30px)}}
.stn button{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:10px 12px;margin-block:4px;border-radius:14px;background:var(--surface);min-height:68px}
.code{flex:none;display:inline-block;min-width:42px;text-align:center;font:800 .9rem var(--display);padding:4px 8px;border-radius:8px;background:var(--c);color:var(--bg)}
.nm{flex:1;min-width:0;font:700 1.18rem/1.2 var(--han)}
.pr{font:400 .82rem/1.25 var(--body);color:var(--muted);display:block;margin-top:2px}
.bar-mini{width:100%;height:6px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden;display:block}
.bar-mini i{display:block;height:100%;background:var(--star)}
.foot{margin-top:24px;display:flex;justify-content:center}
/* Station */
.skills{display:grid;gap:10px;margin-top:6px}
@media(min-width:760px){.skills{grid-template-columns:1fr 1fr}}
.skill{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--surface);padding:14px;border-radius:16px;text-align:left;width:100%}
.skill h3{font:700 1.3rem var(--han)}
.skill small{display:block;font:400 .9rem var(--body);color:var(--muted)}
.star{width:22px;height:22px;display:inline-block;vertical-align:middle}
.star path{fill:var(--surface2);stroke:var(--muted);stroke-width:1}
.star.on path{fill:var(--star);stroke:var(--star)}
.star.big{width:58px;height:58px}
.mission{margin-top:16px;background:var(--hintbg);border-radius:16px;padding:14px 16px}
.mission h3{font-size:1.05rem;margin-bottom:4px}
/* Read-along text */
.w{display:inline-block;border-radius:6px;padding-inline:1px}
.w.now{background:var(--star);color:#231a00}
.u{display:inline-flex;align-items:flex-end;vertical-align:bottom}
.w,.x{display:inline-flex;flex-direction:column;align-items:center}
.py{font:400 .46em/1.15 var(--body);color:var(--muted);min-height:1.15em;white-space:nowrap}
.hz{line-height:1.15}
.pn{line-height:1.15}
.gap{display:inline-block;width:.6em}
.w.now .py{color:#231a00}
.nopy .py{display:none}
.lead{font-family:var(--han);font-weight:700;font-size:clamp(1.5rem,5vw,1.9rem);line-height:1.5}
.subtitle{color:var(--muted);font-size:.98rem}
/* Learn card */
.fc{display:grid;justify-items:center;gap:6px;text-align:center}
.fc .emoji{font-size:3.4rem;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;border-radius:18px;padding:4px 10px;transition:transform .2s,background-color .2s}
.fc .emoji.lit{transform:scale(1.25);background:var(--hintbg)}
.bigc{font:700 clamp(5rem,26vw,7.5rem)/1.4 var(--han)}
.bigc .py{font-size:.26em}
.fcw{font:700 clamp(1.9rem,7vw,2.5rem)/1.9 var(--han)}
.bigpy{font:800 clamp(2.7rem,12vw,4rem)/1.2 var(--body);text-align:center}
.pop-in{animation:popin .42s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes popin{from{opacity:0;transform:scale(.3)}}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* Ride */
.track{position:relative;display:flex;justify-content:space-between;align-items:center;height:44px;margin:0 14px 12px}
.track::before{content:"";position:absolute;left:0;right:0;top:27px;height:6px;background:var(--c);border-radius:3px}
.stop{position:relative;width:14px;height:14px;margin-top:16px;border-radius:50%;background:var(--surface);border:3px solid var(--c);z-index:1}
.stop.done{background:var(--c)}
.stop.miss{background:var(--surface2)}
.train{position:absolute;top:0;width:44px;height:24px;margin-left:-22px;transition:left .6s ease-in-out;z-index:2}
.play{display:grid;gap:14px}
@media(min-width:820px){.play{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.card{background:var(--surface);border-radius:20px;padding:18px;min-width:0}
.prompt{display:flex;gap:10px;align-items:flex-start}
.prompt>div{flex:1;min-width:0}
.vis{margin-top:12px;padding-block:6px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:14px;transition:background-color .2s}
.vis.talking,.talking{background:var(--hintbg);box-shadow:0 0 0 6px var(--hintbg)}
.playbtn{display:inline-flex;align-items:center;gap:10px;min-height:74px;padding:10px 24px;border-radius:40px;background:var(--line-py);color:#fff;font:800 1.25rem var(--han)}
.playbtn svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.playbtn.live{background:var(--star);color:#231a00}
.feedback{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:1.05rem}
.feedback.ok{background:var(--okbg)}.feedback.ok b{color:var(--ok)}
.feedback.no{background:var(--nobg)}.feedback.no b{color:var(--no)}
.feedback.hint{background:var(--hintbg)}
.feedback .hanz{font:700 1.45rem/1.7 var(--han);display:block}
.fbrow{display:flex;gap:10px;align-items:flex-start}.fbrow>div{flex:1;min-width:0}
.fbrow .iconbtn{width:40px;height:40px;background:var(--surface)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tools{display:grid;gap:10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:84px;padding:8px;border-radius:14px;background:var(--surface);box-shadow:0 2px 0 var(--hair);font:700 2rem/1.15 var(--han);display:flex;align-items:center;justify-content:center;min-width:0}
.choice.small{font-size:1.3rem;font-family:var(--han),var(--body)}
.choice.latin{font:800 1.5rem var(--body)}
.choice.wrong{background:var(--nobg);opacity:.7}
.choice.right{background:var(--okbg);outline:3px solid var(--ok)}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:62px;align-items:center;border:3px dashed var(--hair);border-radius:14px;padding:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:56px;min-height:56px;padding:4px 12px;border-radius:12px;background:var(--surface);box-shadow:0 2px 0 var(--hair);font:700 1.5rem var(--han)}
.chip[disabled]{opacity:.2}
.chip.in{background:var(--ink);color:var(--bg);box-shadow:none}
/* Writing */
.writewrap{display:flex;flex-direction:column;align-items:center;gap:10px}
#hz{position:relative;width:min(300px,78vw);aspect-ratio:1;background:var(--surface);border:3px solid var(--grid);touch-action:none;border-radius:6px}
#hz svg{position:absolute;inset:0;width:100%;height:100%}
#hz .gridl{stroke:var(--grid);stroke-dasharray:6 6;stroke-width:1}
.wstatus{font-size:1rem;text-align:center;min-height:1.5em}
.chars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chars span{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--surface2);font:700 1.3rem var(--han)}
.chars span.cur{background:var(--ink);color:var(--bg)}.chars span.ok{background:var(--okbg)}
.done-card{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:28px}
.done-card h1{font-size:clamp(2rem,7vw,3rem)}
.pop{animation:pop .4s ease-out backwards}
@keyframes pop{from{transform:scale(.3)}70%{transform:scale(1.15)}}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl td,.tbl th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl th{font-size:.85rem;color:var(--muted)}
.wrapx{overflow-x:auto}
.parent h2{font-size:1.25rem;margin:22px 0 8px}
.danger{color:var(--no)}
.notice{margin-bottom:12px;background:var(--hintbg);border-radius:12px;padding:10px 14px;font-size:.98rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function textSeg(text,el){return{text,map:[],est:[...text].reduce((a,c)=>a+estMs(c),0),glow:el}}
let reader=null;
const clearNow=()=>app.querySelectorAll('.w.now').forEach(x=>x.classList.remove('now'));
const clearLit=()=>app.querySelectorAll('.lit').forEach(x=>x.classList.remove('lit'));
function stopRead(keep){const r=reader;reader=null;if(keep!==true)clearLit();if(r){r.dead=true;clearTimeout(r.tm);clearTimeout(r.guard);if(r.btn)r.btn.classList.remove('live');if(r.vis)r.vis.classList.remove('talking');app.querySelectorAll('.talking').forEach(x=>x.classList.remove('talking'));clearNow();if(r.done&&keep===true)r.done()}try{if(canSpeak())speechSynthesis.cancel()}catch(e){}}
const hush=stopRead;
function startRead(segs,btn,vis,after){let busy=false;try{busy=canSpeak()&&(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){}stopRead();if(!canSpeak()||!segs.length)return;const r=reader={segs,i:0,btn,vis,done:after};if(btn)btn.classList.add('live');if(vis)vis.classList.add('talking');const go=()=>{if(!r.dead)whenVoices(()=>playSeg(r))};if(busy)r.tm=setTimeout(go,90);else go()}
/* Highlight pace. The voice's real speed is learned as it reads and remembered per voice. */
const PACE_LS='p1-chinese-pace';let paceAll={};try{paceAll=JSON.parse(localStorage.getItem(PACE_LS)||'{}')}catch(e){}
const paceKey=()=>{const v=pickVoice();return (v?v.voiceURI:'default')+'@'+rate()};
const getPace=()=>paceAll[paceKey()]||.62;
function setPace(x){if(!(x>0))return;const k=paceKey(),old=paceAll[k];paceAll[k]=Math.min(1.8,Math.max(.3,old?old*.5+x*.5:x));try{localStorage.setItem(PACE_LS,JSON.stringify(paceAll))}catch(e){}}
function playSeg(r){if(r.dead)return;const seg=r.segs[r.i];if(!seg){stopRead(true);return}clearNow();if(seg.glow)seg.glow.classList.add('talking');
  const map=seg.map;let done=false,started=false,idx=-1,cur=null,startT=0,last=null,sawBound=false,shownAt=0;
  const show=m=>{if(cur)cur.classList.remove('now');cur=m.el;shownAt=performance.now();cur.classList.add('now');if(seg.cue)seg.cue(cur)};
  const sum=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=map[i].ms;return t};
  const advance=()=>{if(r.dead||done)return;if(idx<map.length-1){idx++;show(map[idx]);if(idx<map.length-1)r.tm=setTimeout(advance,map[idx].ms*getPace())}};
  const begin=()=>{if(started)return;started=true;startT=performance.now();if(map.length)advance()};
  const next=()=>{if(done||r.dead)return;done=true;clearTimeout(r.tm);clearTimeout(r.guard);if(started&&map.length>2)setPace((performance.now()-startT)/seg.est);if(seg.glow)seg.glow.classList.remove('talking');if(cur)cur.classList.remove('now');r.i++;r.tm=setTimeout(()=>playSeg(r),seg.pause||420)};
  try{const u=new SpeechSynthesisUtterance(fixSay(seg.text));const v=pickVoice();u.lang=v?v.lang:'zh-CN';if(v)u.voice=v;u.rate=rate();u.pitch=1;
    u.onstart=begin;
    u.onboundary=e=>{if(r.dead||done||!map.length||(e.name&&e.name!=='word'))return;begin();sawBound=true;let h=0;map.forEach((m,i)=>{if(m.at<=e.charIndex)h=i});const now=performance.now();
      last={t:now,i:h};clearTimeout(r.tm);
      if(h>=idx){const go=()=>{if(r.dead||done)return;if(h>idx){idx=h;show(map[idx])}if(idx<map.length-1)r.tm=setTimeout(advance,map[idx].ms*getPace())};const wait=h>idx?130-(now-shownAt):0;if(wait>0)r.tm=setTimeout(go,wait);else go()}
      else if(idx<map.length-1)r.tm=setTimeout(advance,sum(h,idx+1)*getPace())};
    u.onend=next;u.onerror=next;r.guard=setTimeout(next,seg.est*2.5+5000);setTimeout(()=>{if(!r.dead&&!done)begin()},1200);speechSynthesis.speak(u)}catch(e){stopRead()}}

/* ride */
function genQ(sk){const s=STN[sk.s],k=s.skills.find(x=>x.id===sk.k);return GEN[k.g](s.type==='lesson'?s.lesson:null)}
function startSkill(sid,kid){const s=STN[sid],k=s.skills.find(x=>x.id===kid);if(k.write){startWrite(sid);return}let items;
 if(k.story){items=storyQs(s.lesson).map(q=>({...q,sk:`${sid}/${kid}`,meta:{s:sid,k:kid}}))}else{const n=k.len||8,seen=new Set();items=[];let g=0;while(items.length<n&&g++<60){const q=GEN[k.g](s.type==='lesson'?s.lesson:null),id=q.q+q.a+(q.vis||'');if(seen.has(id)&&g<50)continue;seen.add(id);items.push({...q,sk:`${sid}/${kid}`,meta:{s:sid,k:kid}})}}
 R={mode:'skill',sid,kid,title:k.t,color:s.line,items,i:0,first:0,base:items.length,extra:0,results:[]};beginQ();go('ride')}
function startDaily(){const cand=SKILL_LIST.filter(x=>x.k.g);const miss=Object.entries(S.miss).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c])=>c);const items=[];
 miss.forEach(c=>{const e=BYC[c];if(!e)return;const l=DATA.find(x=>x.n===e.lesson);const q=GEN.rec({...l,read:[e,...shuffle(l.read.filter(x=>x.c!==e.c)).slice(0,6)]});if(q.c!==e.c)return;items.push({...q,sk:`L${l.n}/rec`,meta:{s:'L'+l.n,k:'rec'}})});
 const weights=cand.map(x=>{const r=S.sk[x.key];return !r||!r.n?2:1+3*(1-r.r/r.n)});let guard=0;while(items.length<10&&guard++<200){let t=weights.reduce((a,b)=>a+b,0),v=Math.random()*t,j=0;while(v>weights[j]){v-=weights[j];j++}const c=cand[j],q=GEN[c.k.g](c.s.type==='lesson'?c.s.lesson:null);if(items.some(x=>x.q===q.q&&x.a===q.a))continue;items.push({...q,sk:c.key,meta:{s:c.s.id,k:c.k.id}})}
 R={mode:'daily',title:'今天的旅程',color:'--line-py',items:shuffle(items).slice(0,10),i:0,first:0,base:10,extra:0,results:[]};beginQ();go('ride')}
function beginQ(){R.tries=0;R.state='ask';R.spoken=false;R.msg='';R.inp={seq:[],wrong:[]}}
function fb(q){const box=(cl,head,body)=>{const hz=body&&body.han?`<span class="hanz" id="fbtext">${body.han}</span>`:'';return `<div class="feedback ${cl}"><div class="fbrow"><div>${head?`<b>${head}</b>`:''}${hz}${body&&body.en?`<span>${body.en}</span>`:''}</div>${hz&&canSpeak()?`<button class="iconbtn" data-a="read-fb" aria-label="Read this to me">${SVG_SPK}</button>`:''}</div></div>`};
 if(R.state==='retry')return box('no shake','还不对，再试一次。',{en:`Not yet. Try once more. Hint: ${q.hint}`});
 if(R.state==='hint')return box('hint','Hint:',{en:q.hint});
 if(R.state==='right')return box('ok','对了！',q.why);
 if(R.state==='shown')return box('no','答案是：'+answerText(q),q.why);return ''}
function answerText(q){if(q.kind==='order')return q.a.join('').replace(/\s/g,'');const c=q.choices&&q.choices.find(x=>x.v===q.a);return c?c.l:q.a}
function vRide(){const q=R.items[R.i],n=R.items.length,pos=R.i/(n-1||1)*100;const stops=R.items.map((_,i)=>`<span class="stop ${i<R.i?(R.results[i]?'done':'miss'):''}"></span>`).join('');const s=STN[q.meta.s],fin=R.state==='right'||R.state==='shown';
 const storyBlock=q.story?`<div class="vis" id="storyv" style="align-items:stretch"><div class="lead" id="storyt" style="font-size:clamp(1.25rem,4.4vw,1.5rem)">${ruby(q.story.text,q.story.py)}</div><div class="row"><button class="btn alt" data-a="read-story" style="min-height:44px;padding:6px 16px;font-size:.95rem">听故事 Hear it</button></div></div>`:'';

 if(q.kind==='choice')input=`<div class="choices">${q.choices.map((c,i)=>`<button class="choice ${q.latin?'latin':''} ${q.small||String(c.l).length>2?'small':''} ${fin&&c.v===q.a?'right':''} ${R.inp.wrong.includes(c.v)?'wrong':''}" data-a="choice" data-v="${i}" ${fin?'disabled':''}>${c.l}</button>`).join('')}</div>${fin?next:''}`;
 if(q.kind==='order'){const seq=R.inp.seq;input=`<div class="slots" aria-label="Your sentence">${(fin?q.a:seq.map(i=>q.tokens[i].t)).map((t,i)=>`<button class="chip in" ${fin?'disabled':''} data-a="ord-rm" data-v="${i}">${t}</button>`).join('')||'<span class="muted">Tap the words</span>'}</div>${fin?next:`<div class="bank">${q.tokens.map((t,i)=>`<button class="chip" data-a="ord" data-v="${i}" ${seq.includes(i)?'disabled':''}>${t.t.replace(/[。！？，]/g,'')}</button>`).join('')}</div><div class="row"><button class="btn alt" data-a="ord-clear">Clear</button><button class="btn" data-a="check" ${seq.length<q.a.length?'disabled style="opacity:.5"':''}>Check</button></div>`}`}
 return `<div class="topbar">${iconBtn('quit',SVG_X,'Stop this ride')}<div class="grow"><p class="eyebrow">${s.code}</p><h2 style="font-size:1.25rem;font-family:var(--han)">${R.title}</h2></div>${pyBtn()}</div>
 <div class="track" style="--c:var(${R.color})">${stops}${TRAIN.replace('id="train"',`id="train" style="left:${R.prevPos??pos}%"`)}</div>
 <div class="play"><div class="card">${body}</div><div class="tools">${input}${R.state==='ask'&&!R.tries?'<button class="textlink" data-a="hint" style="justify-self:center">I need a hint</button>':''}</div></div>`}
const Q_PY={'听一听，这是哪一个字？':'tīng yì tīng zhè shì nǎ yí gè zì','这个拼音是哪一个字？':'zhè gè pīn yīn shì nǎ yí gè zì','这个字怎么读？':'zhè gè zì zěn me dú','哪一个字是这个意思？':'nǎ yí gè zì shì zhè gè yì si','哪一个字可以填进去？':'nǎ yí gè zì kě yǐ tián jìn qù','听一听，是哪一个词语？':'tīng yì tīng shì nǎ yí gè cí yǔ','这个拼音是哪一个词语？':'zhè gè pīn yīn shì nǎ yí gè cí yǔ','听一听，是哪一句话？':'tīng yì tīng shì nǎ yí jù huà','这句话是什么意思？':'zhè jù huà shì shén me yì si','把词语排成一句话。':'bǎ cí yǔ pái chéng yí jù huà','哪一个词语可以填进去？':'nǎ yí gè cí yǔ kě yǐ tián jìn qù','听一听，这是第几声？':'tīng yì tīng zhè shì dì jǐ shēng','这是第几声？':'zhè shì dì jǐ shēng','它的声母是什么？':'tā de shēng mǔ shì shén me','它的韵母是什么？':'tā de yùn mǔ shì shén me','拼起来是什么？':'pīn qǐ lái shì shén me'};

 const q=R.items[R.i];if(R.state==='ask'&&!R.spoken){R.spoken=true;if(q.listen){playListen(q)}else if(S.autoRead){startRead(qSegs(q),app.querySelector('[data-a="read"]'))}}}
function submit(val){const q=R.items[R.i];if(R.state==='right'||R.state==='shown')return;let ok=false;
 if(q.kind==='choice'){ok=val===q.a;if(!ok)R.inp.wrong.push(val)}
 if(q.kind==='order'){const got=R.inp.seq.map(i=>q.tokens[i].t).join('');ok=got===q.a.join('');if(!ok)R.inp.seq=[]}
 R.tries++;if(ok){R.state='right';sfx.ok();finishQ(R.tries===1)}else if(R.tries===1){R.state='retry';sfx.no()}else{R.state='shown';sfx.no();finishQ(false);if(R.extra<2&&q.meta&&R.mode==='skill'&&!STN[q.meta.s].skills.find(k=>k.id===q.meta.k).story){const s=STN[q.meta.s],k=s.skills.find(x=>x.id===q.meta.k);R.items.push({...GEN[k.g](s.type==='lesson'?s.lesson:null),sk:q.sk,meta:q.meta});R.extra++}}render()}

function finishRide(){const s=starsFor(R.first,R.base);if(R.mode==='skill'){const r=rec(`${R.sid}/${R.kid}`);if(s>r.s)r.s=s}else if(!S.stamps.includes(today()))S.stamps.push(today());save();sfx.end();go('done',{s,score:R.first,base:R.base,mode:R.mode,sid:R.sid,kid:R.kid})}

/* writing */
function startWrite(sid){const l=STN[sid].lesson;W={sid,chars:[...l.write],i:0,mistakes:0,total:0,done:[],mode:'demo'};go('write')}
function vWrite(){const s=STN[W.sid],c=W.chars[W.i],e=BYC[c],ok=typeof HanziWriter!=='undefined';
 return `<div class="topbar">${iconBtn('stn-back',SVG_BACK,'Back to the station')}<div class="grow"><p class="eyebrow">${s.code} · 写一写</p><h2 style="font-family:var(--han)">${s.name}</h2></div>${canSpeak()?iconBtn('read-w',SVG_SPK,'Say this character'):''}</div>
 <div class="chars" aria-label="Characters to write">${W.chars.map((x,i)=>`<span class="${i===W.i?'cur':W.done[i]?'ok':''}">${x}</span>`).join('')}</div>
 ${ok?`<div class="writewrap" style="margin-top:12px"><div class="fcw" id="lw" style="line-height:1.7">${e?ruby(e.w,e.wp):''}</div><div id="hz"><svg viewBox="0 0 100 100" aria-hidden="true"><line class="gridl" x1="0" y1="50" x2="100" y2="50"/><line class="gridl" x1="50" y1="0" x2="50" y2="100"/><line class="gridl" x1="0" y1="0" x2="100" y2="100"/><line class="gridl" x1="100" y1="0" x2="0" y2="100"/></svg></div><p class="wstatus" id="wst">${W.mode==='demo'?'Watch the strokes, then you try.':'Now you write it. Follow the strokes in order.'}</p>
 <div class="row">${W.mode==='demo'?'<button class="btn" data-a="w-try" id="wtry">I will try</button>':'<button class="btn alt" data-a="w-watch">Watch again</button>'}</div></div>`:'<p class="notice">The writing tool did not load. Check the internet connection and open this station again.</p>'}
 <p class="muted" style="text-align:center;margin-top:8px">${W.i+1} of ${W.chars.length}${e?` · ${e.en}`:''}</p>`}
function afterWrite(){if(typeof HanziWriter==='undefined')return;const box=document.getElementById('hz'),size=box.clientWidth,c=W.chars[W.i],ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#12301f',outline=getComputedStyle(document.documentElement).getPropertyValue('--hair').trim()||'#ccc';
 const holder=document.createElement('div');holder.style.cssText='position:absolute;inset:0';box.appendChild(holder);
 W.writer=HanziWriter.create(holder,c,{width:size,height:size,padding:10,showCharacter:false,showOutline:true,strokeColor:ink,outlineColor:outline,drawingColor:ink,highlightColor:'#f2a900',strokeAnimationSpeed:.8,delayBetweenStrokes:280,showHintAfterMisses:2,leniency:1.35,drawingWidth:Math.max(16,size/14),charDataLoader:(ch,done)=>done(STROKES[ch])});
 if(W.mode==='demo'){if(canSpeak())startRead(segsFromEl(document.getElementById('lw')),app.querySelector('[data-a="read-w"]'));setTimeout(()=>{try{W.writer.animateCharacter()}catch(e){}},200)}
 else{let local=0;W.writer.quiz({onMistake:()=>{local++;W.mistakes++;sfx.no();const w=document.getElementById('wst');if(w)w.textContent='Try that stroke again. A hint will show.'},onCorrectStroke:()=>{const w=document.getElementById('wst');if(w)w.textContent='Good stroke!'},onComplete:()=>{W.done[W.i]=true;W.total++;sfx.ok();if(canSpeak()&&BYC[c])startRead([textSeg((POLY.has(c)?BYC[c].w:c)+'。')]);setTimeout(()=>{if(view.name!=='write')return;if(W.i>=W.chars.length-1){finishWrite()}else{W.i++;W.mode='demo';render()}},900)}})}}
function finishWrite(){const n=W.chars.length,per=W.mistakes/n,s=per<=.75?3:per<=2?2:1,key=`${W.sid}/write`,r=rec(key);r.n+=n;r.r+=Math.max(0,n-W.mistakes);if(s>r.s)r.s=s;save();sfx.end();go('done',{s,score:Math.max(0,n-W.mistakes),base:n,mode:'skill',sid:W.sid,kid:'write'})}

function vParent(){const weak=Object.entries(S.miss).sort((a,b)=>b[1]-a[1]).slice(0,30);
 return `<div class="parent"><div class="topbar">${iconBtn('home',SVG_BACK,'Back to the map')}<div class="grow"><p class="eyebrow">For grown-ups</p><h1 style="font-size:1.8rem">Progress</h1></div></div>
 <p>${S.stamps.length} stamps · ${totalStars()} of ${allMax()} stars · saved ${syncState==='account'?'to your Claude account and this device':'on this device only'}.</p>
 <h2>Characters to revise</h2>${weak.length?`<p class="han" style="font-size:1.5rem;line-height:1.6">${weak.map(([c])=>c).join(' ')}</p><p class="muted">Today’s ride brings these back first.</p>`:'<p>Nothing yet. Characters your child gets wrong appear here.</p>'}

 ${canSpeak()?`<h2>Reading speed</h2><p><select id="ratepick" aria-label="Reading speed" style="min-height:48px;font:inherit;padding:6px 8px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--hair)">${[[.4,'Slowest'],[.5,'Very slow'],[.62,'Slow'],[.75,'Medium'],[.9,'Faster']].map(([v,l])=>`<option value="${v}" ${rate()===v?'selected':''}>${l}</option>`).join('')}</select></p><p class="muted" style="margin-top:6px">Choose a speed, then tap Test voice below to hear it.</p>
 <h2>Reading voice</h2><p><b>Now using:</b> ${(()=>{const v=pickVoice();return v?v.name.replace(/</g,'&lt;'):'the device’s default voice, because this app cannot see a Chinese voice'})()}</p>
 <div class="row" style="justify-content:flex-start;align-items:center;margin-top:8px"><select id="voicepick" aria-label="Reading voice" style="min-height:48px;max-width:100%;font:inherit;padding:6px 8px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--hair)"><option value="">Best available</option>${voiceList().map(v=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}" ${v.voiceURI===S.voice?'selected':''}>${v.name.replace(/</g,'&lt;')}</option>`).join('')}</select><button class="btn alt" data-a="voice-test">Test voice</button></div>
 <p id="vtest" class="lead" style="margin-top:8px;font-size:1.4rem">${ruby('你好！我们一起学华文。','nǐ hǎo wǒ men yì qǐ xué huá wén'.split(' '))}</p>
 <p class="muted" style="margin-top:6px">Voices come from this device. If you hear no Chinese, or it sounds wrong, add a Chinese (China mainland) voice in the device’s speech settings, then pick it here.</p>`:''}
 <h2>All stations</h2><div class="wrapx"><table class="tbl"><tr><th>Station</th><th>Stars</th></tr>${Object.values(STN).map(s=>`<tr><td><span style="font-family:var(--han);font-weight:700">${s.code} ${s.name}</span></td><td>${stnStars(s)} of ${maxStarsOf(s)}</td></tr>`).join('')}</table></div>
 <h2>Settings</h2><p><label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="readlessons" ${S.readLessons?'checked':''}> Read lessons aloud automatically</label><label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="autoread" ${S.autoRead?'checked':''}> Read each question aloud automatically</label><label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="showpy" ${S.showPy?'checked':''}> Show pinyin above characters</label><label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="soundfx" ${S.sound?'checked':''}> Play sounds for right and wrong answers</label></p>
 <h2>What this follows</h2><p>Each station on the 1A and 1B lines follows a lesson in 欢乐伙伴 2.0. The characters to read and write come from MOE’s published list for standard Chinese. Words, sentences and stories are new, written for practice with P1 characters, and are not the textbook’s passages. Characters are drawn in mainland Simplified Kaiti shapes from Make Me a Hanzi (Arphic Public License), the same shapes used for tracing. Punctuation uses LXGW WenKai GB (SIL Open Font License, © LXGW). Pinyin stations follow the sounds taught in P1, but not lesson by lesson.</p>
 <h2>Start over</h2>${view.confirm?`<p>This clears all stars, stamps and scores.</p><div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-a="reset-yes">Yes, clear everything</button><button class="btn alt" data-a="reset-no">Keep progress</button></div>`:`<button class="btn alt danger" data-a="reset">Clear progress</button>`}</div>`}

/* ---------- events ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;const q=R&&R.items[R.i];
 switch(a){
  case 'home':go('home');break;
  case 'parent':go('parent');break;
  case 'stn':go('station',{id});break;
  case 'stn-back':go('station',{id:view.name==='write'?W.sid:view.id});break;
  case 'learn':go('learn',{id,i:0});break;
  case 'learn-next':view.i++;render();window.scrollTo(0,0);break;
  case 'learn-prev':view.i--;render();break;
  case 'read-learn':if(reader&&reader.btn===b)stopRead();else readLearn();break;
  case 'start':startSkill(b.dataset.s,b.dataset.k);break;
  case 'daily':startDaily();break;
  case 'quit':go(R.mode==='skill'?'station':'home',{id:R.mode==='skill'?R.sid:undefined});break;
  case 'py':S.showPy=!S.showPy;save();if(view.name==='ride'){const sp=R.spoken;render();R.spoken=sp}else render();break;
  case 'read':if(reader&&reader.btn===b)stopRead();else startRead(qSegs(q),b);break;
  case 'listen':playListen(q);break;
  case 'read-story':startRead(segsFromEl(document.getElementById('storyt')),b,document.getElementById('storyv'));break;
  case 'read-fb':if(reader&&reader.btn===b)stopRead();else{const w=document.getElementById('fbtext');startRead([textSeg(q.why.say)],b,w)}break;
  case 'voice-test':startRead(segsFromEl(document.getElementById('vtest')),b);break;
  case 'read-w':{const lw=document.getElementById('lw');startRead(segsFromEl(lw),b);break}
  case 'w-try':W.mode='try';render();break;
  case 'w-watch':W.mode='demo';render();break;
  case 'hint':R.state='hint';{const sp=R.spoken;render();R.spoken=sp}break;
  case 'check':submit();break;
  case 'choice':submit(q.choices[Number(v)].v);break;
  case 'next':nextQ();break;
  case 'ord':R.inp.seq.push(Number(v));render();break;
  case 'ord-rm':R.inp.seq.splice(Number(v),1);render();break;
  case 'ord-clear':R.inp.seq=[];render();break;
  case 'reset':view.confirm=true;render();break;
  case 'reset-no':view.confirm=false;render();break;
  case 'reset-yes':{const snd=S.sound,vc=S.voice;S=blank();S.sound=snd;S.voice=vc;save();view.confirm=false;render();break}
 }});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='readlessons'){S.readLessons=t.checked;save()}if(t.id==='autoread'){S.autoRead=t.checked;save()}if(t.id==='soundfx'){S.sound=t.checked;save()}if(t.id==='showpy'){S.showPy=t.checked;save();applyPy()}if(t.id==='ratepick'){S.rate=Number(t.value);save()}if(t.id==='voicepick'){S.voice=t.value;lockedVoice=null;save();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&view.name==='ride'){const n=document.getElementById('nextbtn');if(n){e.preventDefault();nextQ()}}});
render();
initDb();
</script>

</body></html>
