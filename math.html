<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Holiday Math Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout concept: a Singapore MRT line map. Each math topic is a station; each set of questions is a ride with a train moving stop to stop. */
:root{
  --bg:#eef6fb; --surface:#ffffff; --surface2:#e0edf5; --ink:#10293f; --muted:#4e6579; --hair:#c4d6e2;
  --red:#d42e12; --amber:#b87a00; --green:#00853f; --purple:#8f2ba8; --blue:#0a62c4;
  --ok:#00803c; --okbg:#dcf5e5; --no:#b4330f; --nobg:#fde7dd; --hintbg:#fff3cf;
  --star:#f2a900; --cube1:#2f7fd6; --cube2:#e4572e; --plate:#fff; --rulerbg:#f8e7a8; --rulerink:#3d2f05;
  --gold1:#e7bd4a; --gold2:#8a6508; --silver1:#d6dde3; --silver2:#67747f;
  --display:"Grandstander","Trebuchet MS",sans-serif; --body:"Andika","Segoe UI",Verdana,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1b29; --surface:#172a3c; --surface2:#21384d; --ink:#eaf3fa; --muted:#a4bacb; --hair:#2f4a61;
  --red:#ff6b4f; --amber:#f2b632; --green:#3cc97c; --purple:#d17ee8; --blue:#63aaf5;
  --ok:#53d990; --okbg:#143c29; --no:#ff9a7e; --nobg:#46231a; --hintbg:#40371a;
  --star:#ffc53d; --cube1:#63aaf5; --cube2:#ff855f; --plate:#2a4258; --rulerbg:#e9d68f; --rulerink:#3d2f05;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1b29; --surface:#172a3c; --surface2:#21384d; --ink:#eaf3fa; --muted:#a4bacb; --hair:#2f4a61;
  --red:#ff6b4f; --amber:#f2b632; --green:#3cc97c; --purple:#d17ee8; --blue:#63aaf5;
  --ok:#53d990; --okbg:#143c29; --no:#ff9a7e; --nobg:#46231a; --hintbg:#40371a;
  --star:#ffc53d; --cube1:#63aaf5; --cube2:#ff855f; --plate:#2a4258; --rulerbg:#e9d68f; --rulerink:#3d2f05;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 18px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:1040px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 22px;border-radius:14px;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--ink);color:var(--bg)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--surface2);color:var(--ink)}
.btn.wide{width:100%}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--surface2);flex:none}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="false"]{opacity:.55}
.textlink{text-decoration:underline;color:var(--muted);font-size:.95rem;padding:10px 4px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar .grow{flex:1;min-width:0}
.eyebrow{font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Home */
.mast{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:24px}
.mast h1{font-size:clamp(2.1rem,7vw,3.3rem)}
.ride-card{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:grid;gap:12px}
.ride-card h2{font-size:1.5rem}
.ride-card .btn{background:var(--star);color:#231a00}
.stamps{display:flex;flex-wrap:wrap;gap:4px}
.stamp{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;opacity:.35}
.stamp.on{background:var(--star);border-color:var(--star);opacity:1}
@media(min-width:760px){.mast{grid-template-columns:1.1fr 1fr;align-items:center}}
.line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr}
@media(min-width:760px){.line{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(6,auto);column-gap:28px}}
.stn{position:relative;padding-left:58px}
.stn::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:10px;background:var(--c)}
.stn:first-child::before{top:30px}
.stn:last-child::before{bottom:calc(100% - 30px)}
.stn::after{content:"";position:absolute;left:10px;top:17px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:6px solid var(--c)}
.stn button{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:10px 12px;margin-block:4px;border-radius:14px;background:var(--surface);min-height:68px}
.stn button:hover{background:var(--surface2)}
.code{flex:none;display:inline-block;min-width:42px;text-align:center;font:800 .9rem var(--display);padding:4px 8px;border-radius:8px;background:var(--c);color:var(--bg)}
.stn .nm{flex:1;min-width:0;font-weight:700;font-size:1.08rem;line-height:1.2}
.stn .pr{font-size:.82rem;color:var(--muted);font-weight:400;display:block;margin-top:2px}
.bar-mini{width:100%;height:6px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--star)}
.foot{margin-top:24px;display:flex;justify-content:center}

/* Station */
.head-stn{display:flex;gap:12px;align-items:center}
.head-stn h1{font-size:clamp(1.6rem,5vw,2.3rem)}
.skills{display:grid;gap:10px;margin-top:6px}
@media(min-width:760px){.skills{grid-template-columns:1fr 1fr}}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);padding:14px;border-radius:16px}
.skill h3{font-size:1.15rem}
.skill .stars{grid-column:2;grid-row:1}
.skill .acts{grid-column:1/-1;display:flex;gap:8px}
.skill .acts .btn{flex:1;min-height:50px;font-size:1rem;padding:8px 10px}
.star{width:22px;height:22px;display:inline-block;vertical-align:middle}
.star path{fill:var(--surface2);stroke:var(--muted);stroke-width:1}
.star.on path{fill:var(--star);stroke:var(--star)}
.star.big{width:58px;height:58px}
.mission{margin-top:18px;background:var(--hintbg);border-radius:16px;padding:14px 16px}
.mission h3{font-size:1.05rem;margin-bottom:4px}

/* Ride */
.track{position:relative;display:flex;justify-content:space-between;align-items:center;height:44px;margin:0 14px 12px}
.track::before{content:"";position:absolute;left:0;right:0;top:27px;height:6px;background:var(--c,var(--blue));border-radius:3px}
.stop{position:relative;width:14px;height:14px;margin-top:16px;border-radius:50%;background:var(--surface);border:3px solid var(--c,var(--blue));z-index:1}
.stop.done{background:var(--c,var(--blue))}
.stop.miss{background:var(--surface2)}
.train{position:absolute;top:0;width:44px;height:24px;margin-left:-22px;transition:left .6s ease-in-out;z-index:2}
.play{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.play{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.card{background:var(--surface);border-radius:20px;padding:18px;min-width:0}
.prompt{display:flex;gap:10px;align-items:flex-start}
.prompt p{flex:1;min-width:0;font-size:clamp(1.25rem,3.8vw,1.55rem);line-height:1.3;font-weight:700}
.vis{margin-top:14px;padding-block:8px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-x:auto}
.vis>*{max-width:100%}
.vis svg{max-width:100%;height:auto}
.sum{font:800 clamp(2.1rem,8vw,3rem)/1.2 var(--display);font-variant-numeric:tabular-nums;text-align:center}
.feedback{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:1.05rem}
.feedback.ok{background:var(--okbg);color:var(--ink)}
.feedback.ok b{color:var(--ok)}
.feedback.no{background:var(--nobg);color:var(--ink)}
.feedback.no b{color:var(--no)}
.feedback.hint{background:var(--hintbg);color:var(--ink)}
.feedback .vis{margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ansbox{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:68px;border-radius:14px;background:var(--surface2);font:800 2.3rem var(--display);font-variant-numeric:tabular-nums}
.ansbox .blank{min-width:1.5em;text-align:center;border-bottom:4px solid var(--ink);line-height:1.05}
.key{min-height:62px;border-radius:14px;background:var(--surface);font:800 1.7rem var(--display);box-shadow:0 2px 0 var(--hair)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.go{background:var(--ink);color:var(--bg);font-size:1.2rem;box-shadow:none}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:68px;padding:8px;border-radius:14px;background:var(--surface);box-shadow:0 2px 0 var(--hair);font:800 1.25rem/1.15 var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.choice small{font:400 .95rem var(--body)}
.choice.wrong{background:var(--nobg);opacity:.7}
.choice.right{background:var(--okbg);outline:3px solid var(--ok)}
.choice svg{width:72px;height:72px}
.tools{display:grid;gap:10px}
.iconrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.iconrow button{padding:6px;border-radius:12px;background:var(--surface2);display:flex}
.iconrow button.right{outline:3px solid var(--ok);background:var(--okbg)}
.iconrow button.wrong{background:var(--nobg);opacity:.7}
.iconrow svg{width:42px;height:42px}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;background:var(--surface);padding:8px;border-radius:14px}
.stepper span{text-align:center;font-weight:700}
.stepper button{height:56px;border-radius:12px;background:var(--surface2);font:800 1.4rem var(--display)}
.tray{min-height:76px;border:3px dashed var(--hair);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bank button,.tray button{padding:2px;display:inline-flex;border-radius:10px}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:64px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface2);font:800 1.4rem var(--display)}
.slot.fill{background:var(--ink);color:var(--bg)}
.chip{width:72px;height:60px;border-radius:12px;background:var(--surface);box-shadow:0 2px 0 var(--hair);font:800 1.4rem var(--display)}
.chip[disabled]{opacity:.2}

/* Visual parts */
.cubes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end}
.rod{display:grid;grid-template-rows:repeat(10,10px);gap:1px;width:14px;background:none}
.rod i,.one{display:block;background:var(--cube1);border-radius:2px}
.rod i{width:14px;height:10px}
.one{width:14px;height:14px;background:var(--cube2)}
.ones{display:grid;grid-template-columns:repeat(5,14px);gap:2px;align-self:flex-end;margin-left:6px}
.frames{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,26px);grid-template-rows:repeat(2,26px);gap:2px;background:var(--hair);padding:2px;border-radius:6px}
.frame i{display:flex;align-items:center;justify-content:center;background:var(--surface);position:relative}
.frame i.a::after,.frame i.b::after,.frame i.x::after{content:"";width:18px;height:18px;border-radius:50%}
.frame i.a::after{background:var(--cube1)}
.frame i.b::after{background:var(--cube2)}
.frame i.x::after{background:var(--hair);box-shadow:inset 0 0 0 2px var(--muted)}
.frame i.x::before{content:"";position:absolute;width:22px;height:3px;background:var(--no);transform:rotate(-45deg);z-index:1}
.bond circle{fill:var(--surface2);stroke:var(--ink);stroke-width:3}
.bond circle.ask{fill:var(--hintbg);stroke:var(--amber)}
.bond line{stroke:var(--ink);stroke-width:3}
.bond text{fill:var(--ink);font:800 30px var(--display);text-anchor:middle;dominant-baseline:central}
.vert{display:inline-grid;grid-template-columns:40px 48px 48px;font:800 2.4rem/1.2 var(--display);font-variant-numeric:tabular-nums;text-align:center}
.vert small{font:700 1rem var(--body);color:var(--muted)}
.vert .rule{grid-column:1/-1;border-top:4px solid var(--ink);margin-block:2px}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.group{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-content:center;border:3px solid var(--hair);border-radius:50px;padding:10px;background:var(--plate);width:104px;min-height:104px}
.group svg{width:26px;height:26px}
.tens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tenbox{display:grid;grid-template-columns:repeat(5,28px);gap:1px;padding:4px;border:2px solid var(--hair);border-radius:8px;background:var(--plate)}
.tenbox svg{width:28px;height:28px}
.coin text{font:800 13px var(--display);text-anchor:middle;dominant-baseline:central;fill:#2a2000}
.moneyrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.note{display:inline-flex;flex-direction:column;justify-content:center;width:86px;height:46px;border-radius:5px;padding:2px 8px;color:#fff;font:800 1.2rem/1 var(--display);box-shadow:inset 0 0 0 2px #ffffff55}
.note small{font:400 .62rem var(--body)}
.n2{background:#6d3a9c}.n5{background:#26804a}.n10{background:#b6292c}.n50{background:#1f5ca8}.n100{background:#c86a12}
.purses{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.purse{background:var(--surface2);border-radius:12px;padding:8px;text-align:center;min-width:0}
.purse b{display:block;margin-bottom:4px}
.face{fill:var(--plate);stroke:var(--ink);stroke-width:4}
.tick{stroke:var(--ink)}
.clk text{fill:var(--ink);font:800 15px var(--display);text-anchor:middle;dominant-baseline:central}
.hh{stroke:var(--red);stroke-width:7;stroke-linecap:round}
.mh{stroke:var(--blue);stroke-width:4.5;stroke-linecap:round}
.clk .pin{fill:var(--ink)}
.rul rect.body{fill:var(--rulerbg);stroke:var(--rulerink)}
.rul line{stroke:var(--rulerink)}
.rul text{fill:var(--rulerink);font:700 11px var(--body);text-anchor:middle}
.rul .guide{stroke:var(--muted);stroke-dasharray:3 3}
.shp{stroke:var(--ink);stroke-width:2.5}
.f-square{fill:var(--cube1)}.f-rectangle{fill:#e8a33c}.f-triangle{fill:#3fae76}.f-circle{fill:#e4572e}.f-half{fill:#b05cc8}.f-quarter{fill:#37b7c3}
.graph{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;width:100%;max-width:440px}
.graph .lb{font-weight:700;font-size:.95rem;line-height:1.1;text-align:right}
.graph .rw{display:grid;grid-template-columns:repeat(9,minmax(0,28px));gap:2px;border-left:3px solid var(--ink);padding-left:4px;min-height:32px;align-items:center}
.graph .rw svg{width:100%;height:auto;display:block}
.key-line{font-size:.92rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.key-line svg{width:22px;height:22px}
.bars{display:grid;gap:6px;width:100%;max-width:400px}
.brow{display:flex;gap:6px;align-items:center}
.brow .who{width:58px;text-align:right;font-size:.85rem;font-weight:700;flex:none;overflow-wrap:anywhere;line-height:1.05}
.brow .track2{display:flex;flex:1;min-width:0}
.seg{height:38px;display:flex;align-items:center;justify-content:center;font:800 1.05rem var(--display);border:2px solid var(--ink);margin-left:-2px;background:var(--surface2);min-width:30px}
.seg.q{background:var(--hintbg)}
.total{font:800 1.05rem var(--display);text-align:center;border-top:3px solid var(--ink);margin-left:64px;padding-top:2px}
.plates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.plate{width:94px;min-height:94px;border-radius:50%;border:3px solid var(--hair);background:var(--plate);display:flex;flex-wrap:wrap;gap:0;align-content:center;justify-content:center;padding:8px}
.plate svg{width:22px;height:22px}
.fig{width:220px;max-width:100%}
.tstep{margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl td,.tbl th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl th{font-size:.85rem;color:var(--muted)}
.wrapx{overflow-x:auto}
.done-card{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:28px}
.done-card h1{font-size:clamp(2rem,7vw,3rem)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pop{animation:pop .4s ease-out backwards}
@keyframes pop{from{transform:scale(.3)}70%{transform:scale(1.15)}}
.parent h2{font-size:1.25rem;margin:22px 0 8px}
.danger{color:var(--no)}
/* Read-along */
.w{display:inline-block;border-radius:6px}
.w.now{background:var(--star);color:#231a00;box-shadow:0 0 0 3px var(--star)}
.iconbtn.live{background:var(--star);color:#231a00;animation:speak 1s ease-in-out infinite}
@keyframes speak{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--star) 35%,transparent)}}
.vis.talking,.talking{border-radius:14px;background:var(--hintbg);box-shadow:0 0 0 6px var(--hintbg)}
.fbrow{display:flex;gap:10px;align-items:flex-start}
.fbrow>span{flex:1;min-width:0}
.fbrow .iconbtn{width:40px;height:40px;background:var(--surface)}
.pop-in{animation:popin .42s cubic-bezier(.3,1.5,.5,1) backwards}
.fade-in{animation:fadein .35s ease-out backwards}
.grow-x{transform-box:fill-box;transform-origin:left center;animation:growx .8s ease-out backwards}
.sweep{transform-origin:100px 100px;animation:sweep 1s ease-out backwards}
@keyframes popin{from{opacity:0;transform:scale(.2)}}
@keyframes fadein{from{opacity:0}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes sweep{from{transform:rotate(-70deg)}}
/* Pictures that light up with the spoken words */
.lit{outline:3px solid var(--star);outline-offset:2px;border-radius:10px;transition:transform .18s,background-color .18s}
svg *.lit{outline:0}
.t{display:inline-block;border-radius:8px;padding-inline:4px}
.t.lit,.sum.lit,.vert>.lit,.seg.lit,.total.lit{background:var(--star);color:#231a00;outline:0}
.rod.lit{outline:0}.rod.lit i{background:var(--star);box-shadow:0 0 0 1px var(--amber);transition:background-color .15s}
.rod.lit i:nth-child(10){transition-delay:0s}.rod.lit i:nth-child(9){transition-delay:.03s}.rod.lit i:nth-child(8){transition-delay:.06s}.rod.lit i:nth-child(7){transition-delay:.09s}.rod.lit i:nth-child(6){transition-delay:.12s}.rod.lit i:nth-child(5){transition-delay:.15s}.rod.lit i:nth-child(4){transition-delay:.18s}.rod.lit i:nth-child(3){transition-delay:.21s}.rod.lit i:nth-child(2){transition-delay:.24s}.rod.lit i:nth-child(1){transition-delay:.27s}
.one.lit{background:var(--star);outline:2px solid var(--amber);outline-offset:-1px;border-radius:2px}
.frame i.lit{background:var(--star);outline:0;border-radius:0}
.group.lit,.plate.lit,.purse.lit{background:var(--hintbg);border-color:var(--star);border-radius:50px}
.purse.lit{border-radius:12px}
.rw.lit{background:var(--hintbg);outline-offset:0}
svg.lit,.note.lit{outline:0;transform:scale(1.2);filter:drop-shadow(0 0 5px var(--star))}
.moneyrow>div.lit{background:var(--hintbg)}
.bond circle.lit{fill:var(--star);stroke:var(--amber)}.bond circle.lit+text{fill:#231a00}
.hh.lit,.mh.lit{stroke:var(--star);stroke-width:9}
.clk text.lit{fill:var(--red);font-size:22px}

function numOpts(a,cand,n=4){const out=[a];for(const c of shuffle(cand)){if(out.length>=n)break;if(c>=0&&c<=120&&!out.includes(c))out.push(c)}
  let k=1;while(out.length<n){const c=a+k;if(!out.includes(c))out.push(c);k=k>0?-k:-k+1;if(a+k<0)k=-k+1}return shuffle(out).map(v=>({l:String(v),v}))}

/* ---------- visual builders ---------- */
const rods=(t,o)=>`<div class="cubes">${'<div class="rod">'.concat('<i></i>'.repeat(10),'</div>').repeat(t)}${o?`<div class="ones">${'<span class="one"></span>'.repeat(o)}</div>`:''}</div>`;
function frames(a,b=0,x=0){ /* a blue, b orange, last x of total crossed */

  for(let f=0;f<cells;f+=10){html+='<div class="frame">';for(let i=f;i<f+10;i++){const cl=i>=total?'':i>=total-x?'x':i<a?'a':'b';html+=`<i class="${cl}"></i>`}html+='</div>'}return html+'</div>'}
function bond(w,a,b,miss){const T=(cx,cy,v,k)=>`<circle class="${miss===k?'ask':''}" cx="${cx}" cy="${cy}" r="34"/><text x="${cx}" y="${cy}">${miss===k?'?':v}</text>`;
  return `<svg class="bond" viewBox="0 0 240 180" width="240" role="img" aria-label="number bond"><line x1="120" y1="50" x2="56" y2="130"/><line x1="120" y1="50" x2="184" y2="130"/>${T(120,40,w,'w')}${T(56,138,a,'a')}${T(184,138,b,'b')}</svg>`}
function vert(a,op,b,ans='?'){const d=n=>[n>=10?Math.floor(n/10):'',n%10];const [at,ao]=d(a),[bt,bo]=d(b);
  const ansS=String(ans);const a3=ansS.length>2;
  return `<div class="vert" role="img" aria-label="${a} ${op==='+'?'plus':'minus'} ${b}"><small></small><small>T</small><small>O</small><span></span><span>${at}</span><span>${ao}</span><span>${op}</span><span>${bt}</span><span>${bo}</span><div class="rule"></div><span>${a3?ansS[0]:''}</span><span>${ansS==='?'?'':a3?ansS[1]:ansS.length>1?ansS[0]:''}</span><span>${ansS==='?'?'?':ansS[ansS.length-1]}</span></div>`}

  return `<svg class="coin" viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" role="img" aria-label="${c===100?'1 dollar':c+' cents'}"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="${gold?'var(--gold1)':'var(--silver1)'}" stroke="${gold?'var(--gold2)':'var(--silver2)'}" stroke-width="2"/>${c===100?`<circle cx="${s/2}" cy="${s/2}" r="${r*.7}" fill="var(--silver1)" stroke="var(--gold2)"/>`:''}<text x="${s/2}" y="${s/2+.5}">${l}</text></svg>`}

function clock(h,m){const A=(deg,len)=>{const r=(deg-90)*Math.PI/180;return `x2="${(100+len*Math.cos(r)).toFixed(1)}" y2="${(100+len*Math.sin(r)).toFixed(1)}"`};
  let marks='';for(let i=0;i<60;i++){const r=i*6*Math.PI/180,o=i%5===0;const r1=o?84:89;marks+=`<line class="tick" stroke-width="${o?2.5:1}" x1="${(100+r1*Math.sin(r)).toFixed(1)}" y1="${(100-r1*Math.cos(r)).toFixed(1)}" x2="${(100+93*Math.sin(r)).toFixed(1)}" y2="${(100-93*Math.cos(r)).toFixed(1)}"/>`}
  let nums='';for(let i=1;i<=12;i++){const r=i*30*Math.PI/180;nums+=`<text x="${(100+71*Math.sin(r)).toFixed(1)}" y="${(100-71*Math.cos(r)).toFixed(1)}">${i}</text>`}
  return `<svg class="clk" viewBox="0 0 200 200" width="220" role="img" aria-label="clock showing ${tf(h,m)}"><circle class="face" cx="100" cy="100" r="96"/>${marks}${nums}<line class="hh" x1="100" y1="100" ${A(((h%12)+m/60)*30,46)}/><line class="mh" x1="100" y1="100" ${A(m*6,68)}/><circle class="pin" cx="100" cy="100" r="6"/></svg>`}
const CM=22,RX=14;
function ruler(items,maxcm=15){ /* items: [{from,len,color,h}] */
  const W=maxcm*CM+RX*2,iH=items.length*26+6,H=iH+50;let s=`<svg class="rul" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="ruler in centimetres">`;
  items.forEach((it,i)=>{const y=4+i*26,x=RX+it.from*CM,w=it.len*CM;const c=it.color||'var(--cube1)';
    s+=`<rect x="${x}" y="${y}" width="${w}" height="18" rx="4" fill="${c}" stroke="var(--ink)" stroke-width="1.5"/>`;
    s+=`<line class="guide" x1="${x}" y1="${y+18}" x2="${x}" y2="${iH+8}"/><line class="guide" x1="${x+w}" y1="${y+18}" x2="${x+w}" y2="${iH+8}"/>`});
  s+=`<rect class="body" x="2" y="${iH}" width="${W-4}" height="44" rx="4"/>`;
  for(let i=0;i<=maxcm*2;i++){const x=RX+i*CM/2,c=i%2===0;s+=`<line stroke-width="${c?1.6:.8}" x1="${x}" y1="${iH}" x2="${x}" y2="${iH+(c?16:9)}"/>`;if(c)s+=`<text x="${x}" y="${iH+32}">${i/2}</text>`}
  s+=`<text x="${W-14}" y="${iH+13}" style="font-size:9px">cm</text></svg>`;return s}
const SHAPE_NAME={square:'square',rectangle:'rectangle',triangle:'triangle',circle:'circle',half:'half circle',quarter:'quarter circle'};
const PLURAL={square:'squares',rectangle:'rectangles',triangle:'triangles',circle:'circles',half:'half circles',quarter:'quarter circles'};

  if(kind==='square')el='<rect x="-36" y="-36" width="72" height="72"/>';

  if(kind==='half')el='<path d="M-44 16A44 44 0 0 1 44 16Z"/>';
  if(kind==='quarter')el='<path d="M-30 32L-30 -38A70 70 0 0 1 40 32Z"/>';
  return `<svg viewBox="-60 -60 120 120" width="110" role="img" aria-label="shape"><g class="shp f-${kind}" transform="rotate(${rot})">${el}</g></svg>`}
const sq=(x,y,s)=>({k:'square',e:`<rect x="${x}" y="${y}" width="${s}" height="${s}"/>`});

};

function graphV(rows,unit,k0){return `<div class="graph">${rows.map(r=>`<div class="lb">${r.l}</div><div class="rw">${ic(r.k||k0).repeat(r.v)}</div>`).join('')}</div>`}

  return `<div class="bars">${rows.map(r=>`<div class="brow"><span class="who">${r.who||''}</span><div class="track2">${r.parts.map(p=>`<span class="seg ${p.q?'q':''}" style="width:${p.w/tot*100}%">${p.l}</span>`).join('')}</div></div>`).join('')}${total?`<div class="total">${total}</div>`:''}</div>`}

/* ---------- question generators ---------- */
function makeTen(a,b){const need=10-a;return `${a} needs ${need} to make 10. Split ${b} into ${need} and ${b-need}. 10 + ${b-need} = ${a+b}.`}
function subTen(a,b){const o=a-10;return `Split ${a} into 10 and ${o}. 10 − ${b} = ${10-b}. Then ${10-b} + ${o} = ${a-b}.`}
function addParts(a,b){const at=Math.floor(a/10),ao=a%10,bt=Math.floor(b/10),bo=b%10,s=ao+bo;
  return s>=10?`Ones: ${ao} + ${bo} = ${s}. Write ${s-10}, carry 1 ten. Tens: ${at} + ${bt} + 1 = ${at+bt+1}. So ${a} + ${b} = ${a+b}.`:`Ones: ${ao} + ${bo} = ${s}. Tens: ${at} + ${bt} = ${at+bt}. So ${a} + ${b} = ${a+b}.`}
function subParts(a,b){const at=Math.floor(a/10),ao=a%10,bt=Math.floor(b/10),bo=b%10;
  return ao<bo?`${ao} is smaller than ${bo}, so change 1 ten into 10 ones. Ones: ${ao+10} − ${bo} = ${ao+10-bo}. Tens: ${at-1} − ${bt} = ${at-1-bt}. So ${a} − ${b} = ${a-b}.`:`Ones: ${ao} − ${bo} = ${ao-bo}. Tens: ${at} − ${bt} = ${at-bt}. So ${a} − ${b} = ${a-b}.`}
const sumVis=s=>`<div class="sum">${s}</div>`;
const NUM=(o)=>({kind:'num',...o});
const CH=(o)=>({kind:'choice',...o});

const G={
 count(){const r=Math.random();
   if(r<.35){const k=pick(THINGS),n=ri(11,40);return NUM({q:`How many ${PL[k]} are there?`,vis:tenBoxes(k,n),a:n,hint:'Each full box has 10. Count the tens first, then the ones.',why:`${Math.floor(n/10)} tens and ${n%10} ones make ${n}.`})}
   const n=ri(12,100),t=Math.floor(n/10),o=n%10;return NUM({q:'How many cubes are there?',vis:rods(t,o),a:n,hint:'Each tall stick has 10 cubes. Count in tens, then add the small cubes.',why:`${t} tens and ${o} ones make ${n}.`})},
 place(){const r=ri(0,3),n=ri(11,99),t=Math.floor(n/10),o=n%10;
   if(r===0)return {kind:'build',q:`Build the number ${n}. Tap + to add tens and ones.`,a:n,hint:`${n} has ${t} tens and ${o} ones.`,why:`${n} is ${t} tens and ${o} ones.`};
   if(r===1)return NUM({q:`How many tens are in ${n}?`,vis:sumVis(n),a:t,suf:'tens',hint:'The tens digit is on the left.',why:`${n} = ${t} tens and ${o} ones.`});
   if(r===2)return NUM({q:`How many ones are in ${n}?`,vis:sumVis(n),a:o,suf:'ones',hint:'The ones digit is on the right.',why:`${n} = ${t} tens and ${o} ones.`});
   return NUM({q:`${t} tens and ${o} ones make what number?`,a:n,hint:`Write the tens first, then the ones.`,why:`${t} tens = ${t*10}. ${t*10} + ${o} = ${n}.`})},
 words(){const n=ri(11,99);const d=[n+1,n-1,n+10,n-10,(n%10)*10+Math.floor(n/10)].filter(x=>x>10&&x<100&&x!==n);
   if(Math.random()<.5)return CH({q:`Which number is ${word(n)}?`,a:n,choices:numOpts(n,d),hint:`Listen for the tens word first: ${TN[Math.floor(n/10)]||'teen numbers start with 1'}.`,why:`${word(n)[0].toUpperCase()+word(n).slice(1)} is ${n}.`});

function greedy(s,den){const out=[];for(const c of den){while(s>=c){out.push(c);s-=c}}return out}
function noteWay(s){const out=[];while(s>=50){out.push(50);s-=50}while(s>=10){out.push(10);s-=10}if(s%2===1){out.push(5);s-=5}while(s>=2){out.push(2);s-=2}return out}

let ac;function tone(freqs,dur=.14,type='sine'){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const t=ac.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.5);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*1.6)})}catch(e){}}
const sfx={ok:()=>tone([659,880]),no:()=>tone([220],.2,'triangle'),end:()=>tone([523,659,784,1047],.16)};
const canSpeak=()=>{try{return 'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window}catch(e){return false}};
const RATE=.85;
const FEMALE=/\b(luna|sonia|libby|maisie|hollie|abbi|bella|natasha|jenny|aria|ava|emma|michelle|serena|kate|stephanie|martha|karen|moira|tessa|fiona|samantha|allison|susan|zira|hazel|catherine|nicky|joanna|amy|female)\b/i;
const MALE=/\b(daniel|arthur|oliver|ryan|thomas|guy|david|mark|george|james|alex|aaron|fred|rishi|wayne|william|liam|brian|eric|christopher|roger|steffan|gordon|jamie|malcolm|tom|lee|evan|nathan|noah|tarun|male)\b/i;
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|junior|kathy|organ|ralph|trinoids|whisper|wobble|zarvox|superstar|jester|good news|grandma|grandpa|eddy|\bflo\b|\breed\b|rocko|sandy|shelley|espeak/i;
const NATURAL=/natural|neural|premium|enhanced|siri/i;
function voiceScore(v){const l=String(v.lang).replace('_','-').toLowerCase();if(!l.startsWith('en'))return -999;
  let n=5;if(l==='en-sg')n=30;else if(l==='en-gb')n=25;else if(/en-(au|nz|ie)/.test(l))n=20;else if(l==='en-us')n=15;else if(l==='en-in')n=8;
  if(NOVELTY.test(v.name))n-=200;if(MALE.test(v.name))n-=100;if(FEMALE.test(v.name))n+=90;if(NATURAL.test(v.name))n+=50;else if(/online|google/i.test(v.name))n+=15;return n}
function voiceList(){if(!canSpeak())return[];try{const en=speechSynthesis.getVoices().filter(v=>voiceScore(v)>-90).sort((a,b)=>voiceScore(b)-voiceScore(a));return en.filter(v=>voiceScore(v)>=0).length?en.filter(v=>voiceScore(v)>=0):en}catch(e){return[]}}
let lockedVoice=null;
function pickVoice(){const l=voiceList();if(!l.length)return null;if(S.voice){const m=l.find(v=>v.voiceURI===S.voice);if(m)return lockedVoice=m}
  if(lockedVoice){const m=l.find(v=>v.voiceURI===lockedVoice.voiceURI);if(m&&(!S.voice||m.voiceURI===S.voice))return lockedVoice=m}return lockedVoice=l[0]}
/* iPhones can load voices late. Speaking before they arrive falls back to the device default voice, so wait briefly. */
function whenVoices(cb){const t0=Date.now();(function poll(){if(voiceList().length||Date.now()-t0>1500)cb();else setTimeout(poll,80)})()}
try{document.addEventListener('click',()=>{try{if(canSpeak()&&!voiceList().length){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}},{capture:true,once:true});if(canSpeak())speechSynthesis.getVoices()}catch(e){}
try{if(canSpeak()&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',()=>{if(view.name==='parent'&&!reader)render()})}catch(e){}

function tokSpeak(t,next){let m;
  if(/^\?[,.]?$/.test(t))return next&&/^min/.test(next)?'how many':'what number';
  if(/^_+[.,]?$/.test(t))return 'blank'+(t.match(/[.,]$/)||[''])[0];if(t==='=')return 'equals';if(t==='+')return 'plus';if(t==='−')return 'minus';if(t==='×')return 'times';if(t===',')return '';
  if(m=t.match(/^([ap])\.m\.?([,?!]?)$/i))return `${m[1].toUpperCase()} M${m[2]}`;
  if(t==='h')return 'hour';if(m=t.match(/^min([.,?!]?)$/))return 'minutes'+m[1];if(m=t.match(/^cm([.,?!]?)$/))return 'centimetres'+m[1];
  if(m=t.match(/^(\d{1,2})\.(\d{2})([.,?!]?)$/)){const mm=+m[2];return (mm===0?`${m[1]} o'clock`:mm<10?`${m[1]} oh ${mm}`:`${m[1]} ${mm}`)+m[3]}
  if(m=t.match(/^(\d+)c([.,?!]?)$/))return `${m[1]} cents${m[2]}`;
  if(m=t.match(/^(\d+)(st|nd|rd|th)$/))return ORD[+m[1]]||t;
  return t}
const estMs=txt=>(txt.length*72+130)/RATE+(/[.,?!:]$/.test(txt)?200:0);
function wrapWords(el){if(el.dataset.wrapped)return;el.dataset.wrapped='1';const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];while(tw.nextNode()){if(!tw.currentNode.parentElement.closest('button'))nodes.push(tw.currentNode)}
  nodes.forEach(n=>{if(!n.nodeValue.trim())return;const f=document.createDocumentFragment();n.nodeValue.split(/(\s+)/).forEach(part=>{if(!part)return;if(/^\s+$/.test(part)){f.appendChild(document.createTextNode(part));return}const w=document.createElement('span');w.className='w';w.textContent=part;f.appendChild(w)});n.parentNode.replaceChild(f,n)})}
/* Split an element's words into one utterance per sentence, each with a map from spoken position to word. */
function wordSeg(el){if(!el)return[];wrapWords(el);const spans=[...el.querySelectorAll('.w')],segs=[];let cur=null;
  spans.forEach((sp,i)=>{const t=sp.textContent,nx=spans[i+1]&&spans[i+1].textContent,sp2=tokSpeak(t,nx);if(!cur)cur={text:'',map:[],est:0};
    if(sp2){if(cur.text)cur.text+=' ';cur.map.push({at:cur.text.length,el:sp,ms:estMs(sp2)});cur.text+=sp2;cur.est+=estMs(sp2)}
    if(/[.!?]$/.test(t)&&!/^[ap]\.m\.$/i.test(t)&&cur.text){segs.push(cur);cur=null}});
  if(cur&&cur.text)segs.push(cur);return segs}
function glowSeg(text,el){return{text,map:[],est:estMs(text),glow:el}}
let reader=null;
const clearNow=()=>app.querySelectorAll('.w.now').forEach(x=>x.classList.remove('now'));
function clearLit(){app.querySelectorAll('.lit').forEach(x=>x.classList.remove('lit'))}
function stopRead(keepLit){const r=reader;reader=null;if(keepLit!==true)clearLit();if(r){r.dead=true;clearTimeout(r.tm);clearTimeout(r.guard);if(r.btn)r.btn.classList.remove('live');if(r.vis)r.vis.classList.remove('talking');app.querySelectorAll('.talking').forEach(x=>x.classList.remove('talking'));clearNow()}try{if(canSpeak())speechSynthesis.cancel()}catch(e){}}
const hush=stopRead;
function startRead(segs,btn,vis,cues){let busy=false;try{busy=canSpeak()&&(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){}stopRead();if(!canSpeak()||!segs.length)return;const r=reader={segs,i:0,btn,vis,cues:cues||[],cueAt:0};if(btn)btn.classList.add('live');if(vis)vis.classList.add('talking');
  const go=()=>{if(!r.dead)whenVoices(()=>playSeg(r))};if(busy)r.tm=setTimeout(go,90);else go()}
function resolveCue(spec,root){return (Array.isArray(spec)?spec:[spec]).flatMap(x=>{const[base,range]=x.split('@');let n=[...root.querySelectorAll(base)];if(range!==undefined){const[a,b]=range.split('-').map(Number);n=n.slice(a,(b===undefined?a:b)+1)}return n})}
const normWord=t=>t.replace(/[.,:;!?…]+$/,'').toLowerCase();
/* Link each cue to the next matching spoken word, in order. Returns one entry per cue; idx -1 means the word was not found. */
function bindCues(textEl,list,root){const spans=[...textEl.querySelectorAll('.w')];let pos=0;return (list||[]).map(c=>{let idx=-1;for(let i=pos;i<spans.length;i++){if(normWord(spans[i].textContent)===String(c[0]).toLowerCase()){idx=i;pos=i+1;break}}return{span:idx<0?null:spans[idx],idx,only:!!c[2],els:resolveCue(c[1],root),word:c[0]}})}
function fireCues(r,span){if(!r.cues.length)return;const all=r.spanList||(r.spanList=[...span.parentElement.querySelectorAll('.w')]),at=all.indexOf(span);while(r.cueAt<r.cues.length){const c=r.cues[r.cueAt];if(c.idx<0){r.cueAt++;continue}if(c.idx>at)break;if(c.only)clearLit();c.els.forEach(e=>e.classList.add('lit'));r.cueAt++}}
const PACE_LS='p1-math-pace';let paceAll={};try{paceAll=JSON.parse(localStorage.getItem(PACE_LS)||'{}')}catch(e){}
const paceKey=()=>{const v=pickVoice();return v?v.voiceURI:'default'};
const getPace=()=>paceAll[paceKey()]||1;
function setPace(x){if(!(x>0))return;paceAll[paceKey()]=Math.min(1.8,Math.max(.4,getPace()*.6+x*.4));try{localStorage.setItem(PACE_LS,JSON.stringify(paceAll))}catch(e){}}
function playSeg(r){if(r.dead)return;const seg=r.segs[r.i];if(!seg){stopRead(true);return}clearNow();if(seg.glow)seg.glow.classList.add('talking');
  const map=seg.map;let done=false,started=false,idx=-1,cur=null,startT=0,last=null,sawBound=false;
  const show=m=>{if(cur)cur.classList.remove('now');cur=m.el;cur.classList.add('now');fireCues(r,cur)};
  const sum=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=map[i].ms;return t};

 <p id="vtest" style="margin-top:8px">Hello! Let us count together: 10, 20, 30.</p>
 <p style="margin-top:8px"><b>Now using:</b> ${(()=>{const v=pickVoice();return v?v.name.replace(/</g,'&lt;'):'the device’s default voice, because this app cannot see the voice list'})()}</p>
 <p style="margin-top:8px;color:var(--muted)">Voices come from this device. If they all sound robotic, add an enhanced English voice in the device’s speech settings, then pick it here.</p>`:''}
 <h2>How it works</h2><p>Questions are freshly generated, so each ride is different. A wrong answer gets a hint and a second try. If it is still wrong, the answer and method are shown and a similar question is added at the end. Stars count first-try answers only. Today’s ride gives more questions from weaker skills.</p>
 <p style="margin-top:8px">Topics follow what Singapore schools publish for the current P1 syllabus: whole numbers to 100, addition and subtraction, multiplication within 40, division within 20, money, length in cm, time to 5 minutes, 2D shapes and picture graphs.</p>
 <h2>Start over</h2>${view.confirm?`<p>This clears all stars, stamps and scores.</p><div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-a="reset-yes">Yes, clear everything</button><button class="btn alt" data-a="reset-no">Keep progress</button></div>`:`<button class="btn alt danger" data-a="reset">Clear progress</button>`}</div>`}

/* ---------- events ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
 const q=R&&R.items[R.i];
 const clampUI=()=>render();
 switch(a){
  case 'home':go('home');break;
  case 'parent':go('parent');break;
  case 'stn':S.last=id;go('station',{id});break;
  case 'stn-back':go('station',{id:view.id?SK[view.id]?SK[view.id].st.id:view.id:STATIONS[0].id});break;
  case 'learn':go('learn',{id,i:0});break;
  case 'learn-next':view.i++;hush();render();window.scrollTo(0,0);break;
  case 'learn-prev':view.i--;hush();render();break;
  case 'read-learn':if(reader&&reader.btn===b)stopRead();else{animateVis(app.querySelector('.card > .vis'));readLearn()}break;
  case 'practice':startSkill(id);break;
  case 'daily':startDaily();break;
  case 'quit':go(R.mode==='skill'?'station':'home',{id:R.mode==='skill'?SK[R.id].st.id:undefined});break;
  case 'read':if(reader&&reader.btn===b)stopRead();else startRead(qSegs(q),b);break;
  case 'read-fb':if(reader&&reader.btn===b)stopRead();else startRead(wordSeg(document.getElementById('fbtext')),b);break;
  case 'voice-test':startRead(wordSeg(document.getElementById('vtest')),b);break;
  case 'hint':R.state='hint';render();break;
  case 'k':if(R.buf.length<3){R.buf+=v;if(R.state==='retry'||R.state==='hint'){}const el=document.getElementById('buf');if(el)el.textContent=R.buf}break;
  case 'del':R.buf=R.buf.slice(0,-1);{const el=document.getElementById('buf');if(el)el.innerHTML=R.buf||'&nbsp;'}break;
  case 'check':submit();break;
  case 'choice':submit(q.choices[Number(v)].v);break;
  case 'tap':submit(Number(v));break;
  case 'next':nextQ();break;
  case 'deal':R.inp.given=Math.min(q.deal.t,R.inp.given+q.deal.k);render();break;
  case 't+':if(R.inp.t<10){R.inp.t++;clampUI()}break;
  case 't-':if(R.inp.t>0){R.inp.t--;clampUI()}break;
  case 'o+':if(R.inp.o<9){R.inp.o++;clampUI()}break;
  case 'o-':if(R.inp.o>0){R.inp.o--;clampUI()}break;
  case 'addm':if(R.inp.tray.length<12){R.inp.tray.push(Number(v));R.inp.tray.sort((x,y)=>y-x);clampUI()}break;
  case 'rm':R.inp.tray.splice(Number(v),1);clampUI();break;
  case 'm+':R.inp.m+=5;if(R.inp.m>=60){R.inp.m=0;R.inp.h=hw(R.inp.h+1)}clampUI();break;
  case 'm-':R.inp.m-=5;if(R.inp.m<0){R.inp.m=55;R.inp.h=hw(R.inp.h-1)}clampUI();break;
  case 'h+':R.inp.h=hw(R.inp.h+1);clampUI();break;
  case 'h-':R.inp.h=hw(R.inp.h-1);clampUI();break;
  case 'ord':R.inp.seq.push(Number(v));clampUI();break;
  case 'ord-clear':R.inp.seq=[];clampUI();break;
  case 'reset':view.confirm=true;render();break;
  case 'reset-no':view.confirm=false;render();break;
  case 'reset-yes':{const snd=S.sound;S=blank();S.sound=snd;save();view.confirm=false;render();break}
 }});
app.addEventListener('change',e=>{if(e.target.id==='autoread'){S.autoRead=e.target.checked;save()}if(e.target.id==='soundfx'){S.sound=e.target.checked;save()}if(e.target.id==='readlessons'){S.readLessons=e.target.checked;save()}if(e.target.id==='voicepick'){S.voice=e.target.value;lockedVoice=null;save();render()}});
document.addEventListener('keydown',e=>{if(view.name!=='ride'||!R)return;const q=R.items[R.i];
 if(e.key==='Enter'){const n=document.getElementById('nextbtn');if(n){e.preventDefault();nextQ();return}if(q.kind==='num'&&R.buf){e.preventDefault();submit()}return}
 if(q.kind!=='num'||R.state==='right'||R.state==='shown')return;
 if(/^[0-9]$/.test(e.key)&&R.buf.length<3){R.buf+=e.key;const el=document.getElementById('buf');if(el)el.textContent=R.buf}
 if(e.key==='Backspace'){R.buf=R.buf.slice(0,-1);const el=document.getElementById('buf');if(el)el.innerHTML=R.buf||'&nbsp;'}});

render();
initDb();
</script>

</body></html>
