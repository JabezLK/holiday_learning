<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Holiday Learning">
<title>Holiday Learning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@800&display=swap">
<style>
:root{--bg:#eef6fb;--surface:#fff;--ink:#10293f;--muted:#4e6579;--math:#d42e12;--cn:#00853f;color-scheme:light;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1b29;--surface:#172a3c;--ink:#eaf3fa;--muted:#a4bacb;--math:#ff6b4f;--cn:#3cc97c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.45 "Andika","Segoe UI",Verdana,sans-serif}
main{max-width:560px;margin:0 auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:800 clamp(2.2rem,9vw,3.2rem)/1.1 "Grandstander","Trebuchet MS",sans-serif;margin:0 0 6px}
p{margin:0}
ol{list-style:none;margin:28px 0 0;padding:0}
li{position:relative;padding-left:58px;--c:var(--math)}
li+li{--c:var(--cn)}
li::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:10px;background:var(--c)}
li:first-child::before{top:44px}
li:last-child::before{bottom:calc(100% - 44px)}
li::after{content:"";position:absolute;left:10px;top:30px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:6px solid var(--c)}
a{display:block;margin-block:6px;padding:18px;border-radius:16px;background:var(--surface);color:inherit;text-decoration:none;min-height:88px}
a:focus-visible{outline:3px solid var(--c);outline-offset:2px}
b{display:block;font:800 1.5rem/1.2 "Grandstander","Trebuchet MS",sans-serif}
span{color:var(--muted);font-size:1rem}
</style></head><body><main>
<h1>Holiday Learning</h1><p>Primary 1. Pick a line to start.</p>
<ol><li><a href="math.html"><b>Math</b><span>Numbers, money, time, shapes and more</span></a></li>
<li><a href="chinese.html"><b>华文 Chinese</b><span>Pinyin and the 19 lessons of 欢乐伙伴 2.0</span></a></li></ol>
</main></body></html>
